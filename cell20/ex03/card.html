<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <header class="card-header">
        <h1>User Profile Card</h1>
    </header>

    <div class="card">
        <table class="profile-table">
            <tr>
                <td>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlQI4u5lklNs1N6Lbnn7rd4FhiL12cdqjPjZ1VN2w4eA&s" alt="User Avatar" class="avatar">
                </td>
            </tr>
            <tr>
                <td class="name">Tung tung tung sahur</td>
            </tr>
            <tr>
                <td class="desc">Level 67</td>
            </tr>
            <tr>
                <td class="location">42Paris</td>
            </tr>
            <tr>
                <td class="social-links">
                    <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook" class="social-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" class="social-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="Instagram" class="social-icon">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
