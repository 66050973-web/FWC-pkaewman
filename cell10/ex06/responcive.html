<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        table {
        width: 100%;
        height: 100px;
        border-collapse: collapse;
        table-layout: fixed;
        }

        #first-cell {
            width: 50%;
            background-color: green;
        }

        #second-cell {
            width: 50%;
            background-color: pink;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td id="first-cell">First cell</td>
            <td id="second-cell">Second cell</td>
        </tr>
    </table>
</body>
</html>
